name: Setup Node
description: Install the Node version from .nvmrc and the locked dependencies.
runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        cache: npm
    # make retries npm ci, because one dropped registry connection should not fail a job.
    - name: Install node modules
      shell: bash
      run: make node_modules
