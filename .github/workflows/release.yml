name: Release
on:
  push:
    tags:
      - 'v*.*.*'
# One release at a time, and a release in flight is never canceled.
concurrency:
  group: release
  cancel-in-progress: false
defaults:
  run:
    shell: bash
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check tag format
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: tag '${TAG}' must be in the format vX.Y.Z"
            exit 1
          fi
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # A tag on a commit that never reached main has not been reviewed or tested there.
      - name: Check the tag is on main
        run: |
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "Error: ${GITHUB_REF_NAME} points at ${GITHUB_SHA}, which is not on main."
            echo "  Delete the tag, merge the commit to main, and tag main (make release/tag VERSION=${GITHUB_REF_NAME})."
            exit 1
          fi
      - name: Setup Node
        uses: ./.github/actions/setup-node
      - name: Static checks
        run: make check
      - name: Vulnerability check
        run: make check/vuln
      - name: Unit tests
        run: make test/unit
      - name: Git hook tests
        run: make test/hooks
      - name: Install the browser
        run: make setup/playwright
      - name: End-to-end tests
        run: make test/e2e
      - name: Smoke test
        run: make test/smoke
  release:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Setup Node
        uses: ./.github/actions/setup-node
      - name: Build the release tarball
        run: make build/release
      - name: Upload assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: release/
          if-no-files-found: error
      # --verify-tag refuses to create the tag itself, so a release can only exist
      # for a tag that was pushed on purpose.
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" release/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag
  release-docker:
    needs: release
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/release-docker.yml
    with:
      push: true
