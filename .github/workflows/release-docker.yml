name: Docker Release
permissions:
  contents: read
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Released version to package, without the leading v. Leave empty to use the current tag.'
        required: false
        type: string
      push:
        description: 'Push to GHCR. Uncheck to build and verify only.'
        required: false
        type: boolean
        default: true
  workflow_call:
    inputs:
      version:
        required: false
        type: string
      push:
        required: false
        type: boolean
        default: true
defaults:
  run:
    shell: bash
jobs:
  release-docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="${INPUT_VERSION:-${GITHUB_REF_NAME}}"
          version="${version#v}"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: '${version}' is not a released version (expected X.Y.Z)."
            echo "  Run this workflow from a vX.Y.Z tag, or pass the version input."
            echo "  Released versions: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases"
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "${GITHUB_OUTPUT}"
      # Always the tagged source, so a manual run for an old version packages that version.
      - name: Checkout the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ steps.version.outputs.version }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        if: ${{ inputs.push }}
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # `latest` moves only when the version came from the tag being released. A manual
      # run for an older version publishes its own tag and nothing else, otherwise
      # re-packaging an old release would walk `latest` backwards.
      - name: Build and push image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ inputs.push }}
          provenance: mode=max
          sbom: true
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            GIT_SHA=${{ github.sha }}
          tags: |
            ${{ steps.version.outputs.image }}:${{ steps.version.outputs.version }}
            ${{ inputs.version == '' && format('{0}:latest', steps.version.outputs.image) || '' }}
      # Pull what was just published and prove it starts, reports the right version
      # and passes its own healthcheck.
      - name: Verify the published image
        if: ${{ inputs.push }}
        env:
          IMAGE: ${{ steps.version.outputs.image }}
          VERSION: ${{ steps.version.outputs.version }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker run -d --rm --name verify --read-only --cap-drop ALL \
            -p 127.0.0.1:8798:8787 -e APP_PASSWORD=smoke "${IMAGE}@${DIGEST}"
          if ! ./scripts/smoke.bash http://127.0.0.1:8798 "${VERSION}"; then
            docker logs verify || true
            exit 1
          fi
          docker rm -f verify
          echo "Published ${IMAGE}:${VERSION} (${DIGEST})" >> "${GITHUB_STEP_SUMMARY}"
